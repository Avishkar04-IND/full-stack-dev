<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" integrity="sha384-JcKb8q3iqJ61gNV9KGb8thSsNjpSL0n8PARn9HuZOnIxN0hoP+VmmDGMN5t9UJ0Z" crossorigin="anonymous"/>
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js" integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN" crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js" integrity="sha384-B4gt1jrGC7Jh4AgTPSdUtOBvfO8shuf57BaghqFfPlYxofvL8/KUEfYiJOMMV+rV" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="style.css">
    <script src="function.js"></script>
</head>
<body>
    <div class="container">
        <div class="row pt-3 calculator">
            <div class="col-12 pt-5 text-center">
                <h1>Digital Calculator</h1>
                <p>Perfroms basic arethmatic operations</p>

            </div>

            <div class="col-12">
                <input  type="text" class="form-control w-100" id="result" placeholder="NA" readonly>
            </div>
            <div class="col-12"> 
                <div class="row ">
                    <div class="col-3 p-1">
                        <button class="btn btn-danger w-100" onclick="clearResult()">AC</button>
                    </div>
                    <div class="col-3 p-1">
                        <button class="btn btn-primary w-100" onclick="calculate('%')">%</button>
                    </div>
                    <div class="col-3 p-1">
                        <button class="btn btn-primary w-100" onclick="setOperation('/')">÷</button>
                    </div>
                    <div class="col-3 p-1">
                        <button class="btn btn-primary w-100" onclick="setOperation('*')">x</button>
                    </div>
                </div>
            </div>

            <div class="col-12">
                <div class="row">

                    <div class="col-3 p-1">
                        <button class="btn btn-light w-100" onclick="displayNumber('7')">7</button>
                    </div>

                    <div class="col-3 p-1" >
                        <button class="btn btn-light w-100" onclick="displayNumber('8')">8</button>
                    </div>

                    <div class="col-3 p-1">
                        <button class="btn btn-light w-100" onclick="displayNumber('9')">9</button>
                    </div>

                    <div class="col-3 p-1">
                        <button class="btn btn-warning w-100" onclick="setOperation('-')">−</button>
                    </div>

                </div>
            </div>

            <div class="col-12">
                <div class="row">

                    <div class="col-3 p-1">
                        <button class="btn btn-light w-100" onclick="displayNumber('4')">4</button>
                    </div>

                    <div class="col-3 p-1">
                        <button class="btn btn-light w-100" onclick="displayNumber('5')">5</button>
                    </div>

                    <div class="col-3 p-1">
                        <button class="btn btn-light w-100" onclick="displayNumber('6')">6</button>
                    </div>

                    <div class="col-3 p-1">
                        <button class="btn btn-warning w-100" onclick="setOperation('+')">+</button>
                    </div>

                </div>
            </div>

            <div class="col-12">
                <div class="row">

                    <div class="col-3 p-1">
                        <button class="btn btn-light w-100" onclick="displayNumber('1')">1</button>
                    </div>

                    <div class="col-3 p-1">
                        <button class="btn btn-light w-100" onclick="displayNumber('2')">2</button>
                    </div>

                    <div class="col-3 p-1">
                        <button class="btn btn-light w-100" onclick="displayNumber('3')">3</button>
                    </div>

                    <div class="col-3 p-1">
                        <button class="btn btn-warning w-100" onclick="calculate('=')">=</button>
                    </div>

                </div>
            </div>

            <div class="col-12">
                <div class="row">

                    <div class="col-3 p-1">
                        <button class="btn btn-light w-100" onclick="displayNumber('0')">0</button>
                    </div>

                    <div class="col-3 p-1">
                        <button class="btn btn-light w-100" onclick="displayNumber('.')">.</button>
                    </div>

                    <div class="col-6 p-1">
                        <button class="btn btn-success w-100" onclick="calculate('=')">Ans</button>
                    </div>

                </div>
            </div>
        </div>
    </div>

</body>
</html>
